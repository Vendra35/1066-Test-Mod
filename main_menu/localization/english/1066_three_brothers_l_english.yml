l_english:
 three_brothers: "The Three Brothers"
 three_brothers_desc: "Fernando the Great divided his realm among his sons: Castile to Sancho, León to Alfonso, Galicia to García. Partible inheritance has its own logic, and the eldest brother commands the best army in Iberia."
 three_brothers_info: "The war of Fernando I’s sons over his divided inheritance, 1068-1072, between [GetCountry('CAS').GetName], [GetCountry('LON').GetName] and [GetCountry('GLC').GetName]."
 hint_three_brothers: "[GetSituationByKey('three_brothers').GetNameWithNoTooltip]"
 hint_three_brothers_hint_text: "$hint_three_brothers_hint_text_1$"
 hint_three_brothers_hint_text_1: "Fernando’s will gave each son a crown, and each son an argument. Castile’s army is the finest in Iberia; León’s claim is the eldest kingdom’s; Galicia has the weakest hand at the table. Few divided inheritances survive the funeral by ten years."
 three_brothers_end_settled_tt: "Alfonso rules León and Castile together (from November 1072)"
 three_brothers_end_expired_tt: "The brothers’ war has run its course (1075)"
 three_brothers.1.title: "The Will of Fernando"
 three_brothers.1.desc: "The emperor of the Spains is three years dead, and his division stands: Sancho holds Castile and the army, Alfonso holds León and the crown’s dignity, García holds Galicia and little else. Their father made them swear to keep the peace. Their father is not here."
 three_brothers.1.a: "A kingdom divided is an argument armed."
 three_brothers.10.title: "The Wager of Llantada"
 three_brothers.10.desc: "At Llantada ford the two eldest brothers have agreed to a battle with terms, like a judicial duel writ large: whoever flees the field cedes his kingdom. Sancho’s Castilians break the Leonese line by evening — and Alfonso rides home and keeps his crown anyway. The wager, it seems, bound only the loser’s honour."
 three_brothers.10.a: "A victory is a victory. Note who ran."
 three_brothers.10.b: "Press no further. He is still our brother."
 three_brothers.20.title: "The Weakest Brother"
 three_brothers.20.desc: "García has misruled Galicia into revolt, and his two elder brothers have discovered a rare thing: agreement. The claim is written, the army is mustered, and the bishops are persuaded. What Fernando divided, his sons now begin to reassemble — starting with the piece that cannot defend itself."
 three_brothers.20.a: "The kingdoms were not meant to stay divided."
 three_brothers.20.b: "Spare him. The will was the will."
 three_brothers.25.title: "García in Chains"
 three_brothers.25.desc: "The king of Galicia is a king no longer. Taken under a safe-conduct that proved neither safe nor conduct, García goes to the castle of Luna in fetters — and will wear them, by his own later oath, until they bury him in them. His kingdom is divided between the brothers who swore to protect him."
 three_brothers.25.a: "Galicia returns to the House of Jiménez."
 three_brothers.25.b: "Release him to exile among the Moors."
 three_brothers.30.title: "Golpejera"
 three_brothers.30.desc: "On the plain by the Carrión the two remaining kings settle the will at last. Sancho’s army takes Alfonso prisoner before noon; by Easter Alfonso is a guest-hostage of al-Ma’mūn, the Muslim king of Toledo, walking the walls of the greatest fortress city in Iberia and — men will later say — memorising them."
 three_brothers.30.a: "One crown now. León obeys Castile."
 three_brothers.30.b: "Let him keep the title. The army is what obeys."
 three_brothers.40.title: "The Bolt from the Wall"
 three_brothers.40.desc: "Only Zamora holds out, and the siege drags. A knight of the town, Vellido Dolfos, comes out to Sancho’s camp offering to show the king a weak gate — and on the walk there puts a bolt through him. The kings of Castile die as they live: in the field. The exile in Toledo will be home within the month."
 three_brothers.40.a: "The crown returns to Alfonso. God’s judgement is plain."
 three_brothers.40.b: "We want no crown from a murderer’s hand."
 three_brothers.90.title: "One Crown After All"
 three_brothers.90.desc: "Fernando’s experiment is over. Of the three brothers one is dead below the walls of Zamora, one sits in chains he has sworn never to remove, and one — the one who lost every battle — rules everything from León. The lawyers will argue the oath of Santa Gadea for a generation; the map has already ruled."
 three_brothers.90.a: "So ends the will of Fernando."
 STATIC_MODIFIER_NAME_tb_king_in_toledo: "The King in Toledo"
 STATIC_MODIFIER_DESC_tb_king_in_toledo: "Alfonso is a guest of al-Ma’mūn — sheltered, watched, and absent. A kingdom whose king waits at a foreign court speaks with half a voice."
