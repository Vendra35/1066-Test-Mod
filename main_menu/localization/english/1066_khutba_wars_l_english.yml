l_english:
 khutba_wars: "The Khutba Wars"
 khutba_wars_desc: "In the mosques of the holy cities, sovereignty is a sentence: the name of the caliph for whom the Friday prayer is read. Mecca’s khutba is for sale, and two caliphates are bidding."
 khutba_wars_info: "The contest for the allegiance of the holy cities, 1069-1077, fought in Friday prayers between [GetCountry('FAT').GetName] and [GetCountry('ABS').GetName]."
 hint_khutba_wars: "[GetSituationByKey('khutba_wars').GetNameWithNoTooltip]"
 hint_khutba_wars_hint_text: "$hint_khutba_wars_hint_text_1$\n\n$hint_khutba_wars_hint_text_2$"
 hint_khutba_wars_hint_text_1: "In Mecca the Friday prayer is about to change its address. Whoever the holy cities name in the khutba is the caliph of Islam in the eyes of every pilgrim — and both caliphates know it."
 hint_khutba_wars_hint_text_2: "#T Extra Hints:#!\n@hint! The khutba follows the money as much as the sword. Watch what the Sharif is offered — and by whom."
 khutba_wars_end_settled_tt: "Mecca’s khutba has settled on Baghdad’s name (from mid-1077)"
 khutba_wars_end_expired_tt: "The contest for the pulpits has run its course (1080)"
 opinion_khutba_rivals: "$khutba_wars$"
 abbasid_khutba_reform: "The Khutba Restored"
 abbasid_khutba_reform_desc: "The holy cities read the Friday sermon in the Abbasid caliph's name once more. Those who have the khutba pronounced for the house of Abbas keep their thrones and their courts — and acknowledge whose blessing they rule under."
 STATIC_MODIFIER_NAME_kw_khutba_for_baghdad: "The Khutba for Baghdad"
 STATIC_MODIFIER_DESC_kw_khutba_for_baghdad: "The Friday prayer in the holy city names the Abbasid caliph. Pilgrims carry the news to every land of Islam, and the Sharif’s standing rises with it."
 STATIC_MODIFIER_NAME_kw_the_caliphs_good_day: "The Caliph’s Good Day"
 STATIC_MODIFIER_DESC_kw_the_caliphs_good_day: "Mecca prays for the house of Abbas again. In Baghdad the black banners hang from the palace gates, and the Commander of the Faithful is obeyed at least in the words of the faithful."
 STATIC_MODIFIER_NAME_kw_the_shamed_caliphate: "The Shamed Caliphate"
 STATIC_MODIFIER_DESC_kw_the_shamed_caliphate: "The holy cities have dropped the Imam-Caliph’s name from the Friday prayer. In Cairo the da‘wa preaches on, but every pilgrim returning from Mecca carries the shame home."
 khutba_wars.1.title: "The Name in the Prayer"
 khutba_wars.1.desc: "Every Friday, in every mosque of the holy cities, the preacher names the caliph for whom the faithful pray — and for a century that name has come from Cairo. Now Baghdad’s star rises with the Seljuk sword, and in Mecca the Sharif is listening to offers."
 khutba_wars.1.a: "The pulpits will decide it."
 khutba_wars.10.title: "The Friday the Name Changed"
 khutba_wars.10.desc: "The great mosque of Mecca is full, and Abu Hashim has made his choice. This Friday the khutba will not name the Imam-Caliph in Cairo; it will name al-Qa’im of Baghdad — and with one sentence, spoken aloud, the holy city will change its allegiance without a sword drawn."
 khutba_wars.10.a: "Read the prayer for Baghdad."
 khutba_wars.10.b: "Cairo’s name has served us well."
 khutba_wars.10.c: "Read it for no caliph but God."
 khutba_wars.11.title: "Gold for a Sentence"
 khutba_wars.11.desc: "The news comes down the pilgrim road: Mecca prays for the Abbasid. Al-Mustansir’s court cannot march an army across the Red Sea, but it holds what Baghdad does not — the treasury of Egypt. The vizier proposes to buy back with gold what was lost from the pulpit."
 khutba_wars.11.a: "Send the gold south. Mecca will pray for us again."
 khutba_wars.11.b: "Cut the grain ships instead. Let hunger argue."
 khutba_wars.11.c: "The Hijaz was always a cost. Let it go."
 khutba_wars.20.title: "The Caliph’s One Good Day"
 khutba_wars.20.desc: "For a generation the Commander of the Faithful has commanded little beyond his palace walls, his name read in fewer cities every year. Today it is read in Mecca. Al-Qa’im weeps in the audience hall, and even the Seljuk sultan’s envoys stand silent while the old man prays."
 khutba_wars.20.a: "God has remembered the house of Abbas."
 khutba_wars.30.title: "The Patron’s Letter"
 khutba_wars.30.desc: "Ali al-Sulayhi conquered Yemen in the Fatimid name and set Abu Hashim over Mecca with Cairo’s blessing; now his own appointee reads the prayer for Baghdad. The letter from San’a is courteous, pained and unmistakable: the da‘wa does not forget its friends, nor its debts."
 khutba_wars.30.a: "Press the Sharif to return to Cairo’s name."
 khutba_wars.30.b: "The mountains are far from the Hijaz. Note it, and wait."
 khutba_wars.40.title: "The Reversal"
 khutba_wars.40.desc: "Cairo’s answer has arrived in chests: gold struck with the Imam-Caliph’s name, grain promised for the pilgrim cities, and the friendship of the master of Egypt. The Abbasid name has brought honour but little else. The preachers await the Sharif’s word for this Friday’s prayer."
 khutba_wars.40.a: "Take the gold. Cairo’s name returns to the pulpit."
 khutba_wars.40.b: "Baghdad’s name stays. Send the chests back."
 khutba_wars.50.title: "The Black Banners for Good"
 khutba_wars.50.desc: "The bargain has soured: the gold from Cairo arrives late, then not at all, and the Seljuk grip on the pilgrim roads tightens every season. Abu Hashim weighs the treasuries a final time. Whatever is read this Friday will be read for a lifetime."
 khutba_wars.50.a: "For Baghdad — and let it stand."
 khutba_wars.50.b: "Cairo has kept faith enough."
 khutba_wars.90.title: "The Age of the Black Banners"
 khutba_wars.90.desc: "The wars of the khutba are over. The names read from the pulpits of Mecca and Medina have settled, and with them a map of allegiance that armies never drew: sovereignty in the Islamic world has shown itself to be a sentence — spoken every Friday, and heard from al-Andalus to the Indus."
 khutba_wars.90.a: "So it is written, so it is read."
