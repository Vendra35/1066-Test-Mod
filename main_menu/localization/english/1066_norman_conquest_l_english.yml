 seljuk_khutba_reform: "Recognition of the Khutba"
 seljuk_khutba_reform_desc: "Across the lands of the eastern caliphate the Friday sermon is read in the Sultan's name. The emirs who have the khutba pronounced for the House of Seljuk keep their thrones, their courts and their wars — and acknowledge whose peace they live under."
 seljuk_nizamiyya_reform: "The Nizamiyya"
 seljuk_nizamiyya_reform_desc: "The sword is Turkic, the pen is Persian. The diwans, the tax rolls and the madrasas of the realm are run by Persian administrators in the manner perfected by the great viziers — a dual state in which the dynasty commands and the bureaucracy governs."
