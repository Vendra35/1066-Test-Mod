l_english:
 norman_conquest: "The Norman Conquest"
 norman_conquest_desc: "Edward the Confessor is dead, and three kings claim his crown. Harold Godwinson holds London and the witan's blessing; Harald Hardrada of Norway sails with three hundred ships and an old compact; William of Normandy sails with seven hundred and a papal banner. Before Christmas, the matter of England will be settled in blood."
 norman_conquest_info: "The struggle for the English crown in 1066, fought between [GetCountry('ENG').GetName], [GetCountry('NOR').GetName] and [GetCountry('NRM').GetName]."
 NORMAN_CONQUEST_WAR_NAME: "Norman Conquest of England"
 NORWEGIAN_INVASION_WAR_NAME: "Norwegian Invasion of England"
 cb_norman_conquest: "Claim the Throne of England"
 cb_norman_conquest_desc: "Edward the Confessor promised the crown, and Harold swore his oath upon holy relics. The claim will be settled by arms."
 cb_norwegian_invasion: "Invade England"
 cb_norwegian_invasion_desc: "By the old compact between Magnus and Harthacnut, the crown of England belongs to the King of Norway."
 casus_belli_limits_conquest_to_britain_tt: "This war is fought for Great Britain — conquest elsewhere is not covered by its cause."
 war_goal_norman_conquest_wargoal: "Conquest of England"
 war_goal_norman_conquest_wargoal_desc: "Take the English crown by force of arms."
 war_goal_norwegian_invasion_wargoal: "Invasion of England"
 war_goal_norwegian_invasion_wargoal_desc: "Take the English crown by force of arms."
 norman_conquest.1.title: "The Year of Three Kings"
 norman_conquest.1.desc: "Edward the Confessor is dead, and Harold Godwinson has taken the crown of England. Across the sea two men name him usurper: William of Normandy, who says the crown was promised him, and Harald Hardrada of Norway, who claims it by an older compact. Fleets are gathering on two coasts, and England's levies cannot watch both."
 norman_conquest.1.a: "This year will be remembered."
 norman_conquest.11.title: "The King's Levy Sails"
 norman_conquest.11.desc: "Three hundred ships lie off the Yorkshire coast. Tostig Godwinson, the English king's own exiled brother, rides with us and swears the north will rise. York lies open beyond the Ouse."
 norman_conquest.11.a: "England is ours by right. Land the host!"
 norman_conquest.11.b: "Hold the fleet. The hour is not ripe."
 norman_conquest.12.title: "The Bridge at Stamford"
 norman_conquest.12.desc: "The English king has come north at a killing pace — five days from London — and caught the host unarmoured in the September sun. The bridge is held by a single axeman while the army forms behind the Derwent. Arrows begin to fall around the king's banner, the Land-Waster."
 norman_conquest.12.a: "Seven feet of English ground for the tallest of kings."
 norman_conquest.12.b: "Sound the withdrawal — we fight another day."
 norman_conquest.13.title: "Victory at Stamford Bridge"
 norman_conquest.13.desc: "The Norwegian king is slain and his host broken; of three hundred ships, a few dozen carry the survivors home. But the fyrd is spent and bleeding, and word comes from the south coast: Norman sails off Pevensey."
 norman_conquest.13.a: "Now south, before William digs in."
 norman_conquest.21.title: "The Fleet at Saint-Valery"
 norman_conquest.21.desc: "The wind has turned at last. Seven hundred ships wait in the estuary bearing knights, horses and the banner blessed by Rome itself. Harold's oath, sworn on holy relics at Bayeux, is broken — and all Christendom knows it."
 norman_conquest.21.a: "God wills it. We sail for Pevensey!"
 norman_conquest.21.b: "The season grows late. We wait."
 norman_conquest.30.title: "Senlac Hill"
 norman_conquest.30.desc: "The Norman host is drawn up below the ridge — footmen, archers, and the mailed horsemen England has never faced in strength. The shield-wall holds the high ground, but the men are weary from the north road, and the housecarls are fewer than at Stamford. William's banners advance."
 norman_conquest.30.a: "The wall holds here, or England falls. Stand!"
 norman_conquest.30.b: "Fall back toward London — let him starve in a wasted land."
 norman_conquest.31.title: "The Field of Senlac"
 norman_conquest.31.desc: "The shield-wall broke at dusk and the English king lies dead upon the ridge with his brothers beside him. The road to London lies open, and the crown of England is within reach at last."
 norman_conquest.31.a: "To London — and to the crown."
 norman_conquest.40.title: "Christmas at Westminster"
 norman_conquest.40.desc: "Canterbury has submitted, London's gates stand open, and the English magnates have made their peace one by one. In the abbey Edward built, on Christmas Day, the crown of England waits."
 norman_conquest.40.a: "Let them cry: God save King William!"
 norman_conquest.40.b: "Not yet. The land must first be made quiet."
 norman_conquest.41.title: "The Norman Yoke"
 norman_conquest.41.desc: "On Christmas Day, in Westminster Abbey, Duke William of Normandy was crowned King of England. The old English order — its earls, its thegns, its law — now bends to a foreign court, and the shout of acclamation in the abbey was answered by Norman swords outside."
 norman_conquest.41.a: "England endures, whoever wears the crown."
 norman_conquest.42.title: "The Duke Demands the Crown"
 norman_conquest.42.desc: "Harold is dead on Senlac ridge and the witan is scattered. William stands before London with an army and a papal banner, demanding the crown he says was promised him. We may bow — or make him take every hide of England by force."
 norman_conquest.42.a: "Bow. Spare the land the harrying."
 norman_conquest.42.b: "England is not his to demand. Fight on!"
 norman_conquest.90.title: "The Matter of England Settled"
 norman_conquest.90.desc: "The year of three kings is over, and the matter of England is settled — for this generation. What was decided on the ridges of Yorkshire and Sussex will shape every court from Dublin to Constantinople."
 norman_conquest.90.a: "So passes the old world."
 opinion_norman_conquest_enemies: "$norman_conquest$"
 STATIC_MODIFIER_NAME_norman_conquest_impact: "$norman_conquest$"
 STATIC_MODIFIER_NAME_bled_at_stamford_bridge: "Bled at Stamford Bridge"
 STATIC_MODIFIER_DESC_bled_at_stamford_bridge: "The fyrd marched two hundred miles and fought the hardest battle in living memory. The men who must now face the Normans are weary, and too many good housecarls lie dead by the Derwent."
 STATIC_MODIFIER_NAME_papal_banner: "The Papal Banner"
 STATIC_MODIFIER_DESC_papal_banner: "Rome has blessed this enterprise. The banner of Saint Peter flies over the host, and every man beneath it fights with God at his back."
 STATIC_MODIFIER_NAME_the_norman_yoke: "The Norman Yoke"
 STATIC_MODIFIER_DESC_the_norman_yoke: "A foreign court rules from Westminster. The old English order — its earls, its thegns, its law — bends slowly, and resentfully, to Norman ways."
